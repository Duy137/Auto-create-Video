<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoClip Demo Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="glass-bg"></div>
    
    <main class="app-container">
        <header>
            <div class="logo">
                <span class="pulse"></span>
                <h1>AutoClip <span class="badge">Demo</span></h1>
            </div>
            <p class="subtitle">AI Text-to-Video Pipeline</p>
        </header>

        <section class="card pipeline-card">
            <div class="step-indicator" id="step-indicator">
                <div class="step active" data-step="1"><span class="step-number">1</span><span class="step-label">Input</span></div>
                <div class="step" data-step="2"><span class="step-number">2</span><span class="step-label">JSON Review</span></div>
                <div class="step" data-step="3"><span class="step-number">3</span><span class="step-label">Rendering</span></div>
                <div class="step" data-step="4"><span class="step-number">4</span><span class="step-label">Final Video</span></div>
            </div>

            <!-- Step 1: Input -->
            <div id="view-input" class="view">
                <div class="input-group">
                    <label for="input-text">Content Script</label>
                    <textarea id="input-text" aria-label="Content script" placeholder="Enter at least 30 words for your video script..."></textarea>
                    <div class="word-count" id="word-count">Words: <span id="word-count-val">0</span> / 30</div>
                </div>

                <div class="settings-row">
                    <div class="setting">
                        <label for="voice-select">Voice</label>
                        <select id="voice-select" aria-label="Voice selection">
                            <option value="nova">Nova (Default)</option>
                            <option value="alloy">Alloy</option>
                            <option value="echo">Echo</option>
                            <option value="fable">Fable</option>
                            <option value="onyx">Onyx</option>
                            <option value="shimmer">Shimmer</option>
                        </select>
                    </div>
                    <div class="setting setting-rate">
                        <label for="rate-select">Speed: <span id="rate-val" class="rate-val-accent">1.0x</span></label>
                        <input type="range" id="rate-select" class="rate-slider" aria-label="Speech rate" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>
                </div>

                <button id="btn-generate-props" aria-label="Generate video props" disabled>Generate Video Props</button>
            </div>

            <!-- Step 2: JSON Review -->
            <div id="view-review" class="view hidden">
                <h3>Review Video Props</h3>
                <p>Verify scenes, narration, and media queries before final rendering.</p>
                <div class="json-toolbar">
                    <button id="btn-format-json" class="secondary" type="button" aria-label="Format JSON">Format JSON</button>
                    <button id="btn-copy-json" class="secondary" type="button" aria-label="Copy JSON">Copy</button>
                    <button id="btn-reset-json" class="secondary" type="button" aria-label="Reset JSON to original">Reset</button>
                </div>
                <div class="json-editor-container">
                    <textarea id="json-editor" aria-label="Video props JSON editor"></textarea>
                </div>
                <p id="json-validation-msg" class="validation-msg" aria-live="polite"></p>
                <div class="actions">
                    <button id="btn-back-to-input" class="secondary" aria-label="Back to input">Back</button>
                    <button id="btn-start-render" class="primary" aria-label="Start final render">Start Final Render</button>
                </div>
            </div>

            <!-- Step 3: Rendering -->
            <div id="view-rendering" class="view hidden">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <h3 id="render-status-text" aria-live="polite">Processing...</h3>
                    <div class="render-progress">
                        <div class="render-progress-meta">
                            <span>Progress</span>
                            <span id="render-progress-percent">0%</span>
                        </div>
                        <div class="render-progress-track">
                            <div id="render-progress-fill"></div>
                        </div>
                    </div>
                </div>
                <div class="log-container" id="log-container" aria-live="polite">
                    <!-- Logs will appear here -->
                </div>
                <button id="btn-retry-render" class="secondary hidden" type="button" aria-label="Retry with same input">Retry with same input</button>
            </div>

            <!-- Step 4: Final Video -->
            <div id="view-final" class="view hidden">
                <h3>✅ Success! Your video is ready.</h3>
                <div class="video-preview">
                    <video id="final-video" aria-label="Final rendered video preview" controls></video>
                </div>
                <div class="actions">
                    <a id="download-link" href="#" download class="btn-download" aria-label="Download rendered video">Download MP4</a>
                    <button id="btn-restart" class="secondary" aria-label="Start a new video">New Video</button>
                </div>
            </div>
        </section>

        <footer>
            <p>Temporary Demo UI — Port 8080</p>
        </footer>
    </main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
